# Publishes a downloadable JAR for code changes merged into main only.
# Minecraft server install is manual — no deploy steps or secrets.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release inputs
        id: scope
        run: node .github/scripts/change-scope.cjs

  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Version the release working tree; never push a version-only commit or PR.
      - name: Set artifact version from published releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          IFS='.' read -r major minor patch <<< "${CURRENT//-SNAPSHOT/}"
          NEW="${major}.${minor}.$((patch + 1))"

          # Release tags are authoritative after the one-time POM reconciliation.
          while gh release view "v${NEW}" >/dev/null 2>&1; do
            IFS='.' read -r major minor patch <<< "${NEW}"
            NEW="${major}.${minor}.$((patch + 1))"
          done

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="${NEW}" \
            -DgenerateBackupPom=false

      - name: Build release JAR
        run: mvn -B -ntp package

      - name: Publish GitHub Release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="target/WHIMC-QRF-Agent-${NEW_VERSION}.jar"
          test -f "${JAR}"

          gh release create "v${NEW_VERSION}" \
            "${JAR}" \
            --title "v${NEW_VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
