name: CI

on:
  pull_request:
    branches: [main, animal-ai, llm-agent]
  push:
    branches: [animal-ai, llm-agent]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate change classification
        run: node --test .github/scripts/change-scope.test.cjs
      - name: Classify changed files
        id: scope
        run: node .github/scripts/change-scope.cjs

  build:
    name: CI / build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin JAR
        run: mvn -B -ntp package

  dependency-audit:
    name: Dependency Audit / dependency-audit
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify dependency resolution
        run: mvn -B -ntp dependency:tree -Dverbose=false
      - name: Check for undeclared or unused dependencies
        run: mvn -B -ntp dependency:analyze-only -DignoreNonCompile=true

  trufflehog:
    name: TruffleHog / trufflehog
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  analyze:
    name: CodeQL / analyze
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build for CodeQL
        run: mvn -B -ntp package
      - uses: github/codeql-action/analyze@v3
